# Until launch, every file Netlify serves directly is noindex too. Launch day: delete the [[headers]] block
# and set NEXT_PUBLIC_INDEXABLE=true (lib/site.ts).
[build]
  command = "npm run build"
  publish = ".next"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
